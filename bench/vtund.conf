# VTesse bench server configuration.
# Mirrors the structure of the target deployment; all names, addresses and
# passwords here are bench-only test values.

options {
  syslog daemon;
  timeout 60;
  ip /sbin/ip;
}

default {
  type tun;
  proto tcp;
  persist yes;
  keepalive 10:5;
  timeout 60;
  compress no;
  encrypt no;
  stat no;
  speed 512:512;
  multi killold;
}

# Main scenario: type ether, bridged into the DHCP segment. Flags: <TeK>
02BE0C000001 {
  type ether;
  speed 0:0;
  password c79e01d2e49d80eafd192c043c5142bd5a65b5a9;
  up {
    ip "link set %% up multicast off mtu 1500";
    program "brctl addif br-vtesse %%";
  };
  down {
    program "brctl delif br-vtesse %%";
    ip "link set %% down";
  };
}

